name: blindviz
description: "BlindViz 2.0 - Accessible AI Vision Companion for Visually Impaired Users"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.1
  camera: ^0.10.5+9
  google_maps_flutter: ^2.5.3
  vibration: ^1.8.4
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
